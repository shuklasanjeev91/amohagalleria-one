<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Amoha Galleria invitation</title>
  </head>
  <body style="margin:0;padding:0;background:#f3efe8;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f3efe8;">
      <tr>
        <td align="center" style="padding:40px 16px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:560px;background:#fffdf9;border:1px solid #e4d9c8;">
            <tr>
              <td style="height:3px;background:linear-gradient(90deg,#1a1512 0%,#b8956c 48%,#7a3228 100%);font-size:0;line-height:0;">&nbsp;</td>
            </tr>
            <tr>
              <td style="padding:36px;">
                <img
                  src="https://uckttlzwlqkvoahi.public.blob.vercel-storage.com/logo/amohagalleria-HHKrlahRMpINXGJAAuwzqcJAZRi0wm.png"
                  width="168"
                  alt="Amoha Galleria"
                  style="display:block;border:0;height:auto;max-width:168px;"
                />
                <p style="margin:28px 0 0;font-family:Georgia,'Times New Roman',serif;font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:#7a3228;">
                  Invitation
                </p>
                <h1 style="margin:14px 0 0;font-family:Georgia,'Times New Roman',serif;font-size:32px;line-height:1.15;font-weight:500;color:#1a1512;">
                  You are invited
                </h1>
                <p style="margin:16px 0 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.6;color:#6b635a;">
                  You have been invited to Amoha Galleria. Accept with the code below, or open the secure link.
                </p>
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="margin:28px 0 0;background:#1a1512;">
                  <tr>
                    <td align="center" style="padding:28px 20px;">
                      <p style="margin:0 0 10px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#b8956c;">
                        Invitation code
                      </p>
                      <p style="margin:0;font-family:Georgia,'Times New Roman',serif;font-size:40px;line-height:1;letter-spacing:0.28em;color:#fffaf2;">
                        {{ .Token }}
                      </p>
                    </td>
                  </tr>
                </table>
                <p style="margin:24px 0 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;color:#6b635a;">
                  <a href="{{ .ConfirmationURL }}" style="color:#7a3228;text-decoration:underline;">Accept invitation</a>
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
