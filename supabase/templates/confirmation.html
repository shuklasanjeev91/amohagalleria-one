<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirm your Amoha Galleria email</title>
  </head>
  <body style="margin:0;padding:0;background:#f3efe8;-webkit-font-smoothing:antialiased;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f3efe8;">
      <tr>
        <td align="center" style="padding:40px 16px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:560px;background:#fffdf9;border:1px solid #e4d9c8;">
            <tr>
              <td style="height:3px;background:linear-gradient(90deg,#1a1512 0%,#b8956c 48%,#7a3228 100%);font-size:0;line-height:0;">&nbsp;</td>
            </tr>
            <tr>
              <td style="padding:36px 36px 12px;">
                <img
                  src="https://uckttlzwlqkvoahi.public.blob.vercel-storage.com/logo/amohagalleria-HHKrlahRMpINXGJAAuwzqcJAZRi0wm.png"
                  width="168"
                  alt="Amoha Galleria"
                  style="display:block;border:0;height:auto;max-width:168px;"
                />
              </td>
            </tr>
            <tr>
              <td style="padding:8px 36px 0;">
                <p style="margin:0;font-family:Georgia,'Times New Roman',serif;font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:#7a3228;">
                  Welcome
                </p>
                <h1 style="margin:14px 0 0;font-family:Georgia,'Times New Roman',serif;font-size:32px;line-height:1.15;font-weight:500;color:#1a1512;">
                  Confirm your email
                </h1>
                <p style="margin:16px 0 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.6;color:#6b635a;">
                  Use the code below to finish joining Amoha Galleria, or open the secure link if your client supports it.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:28px 36px 8px;">
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#1a1512;">
                  <tr>
                    <td align="center" style="padding:28px 20px;">
                      <p style="margin:0 0 10px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#b8956c;">
                        Verification code
                      </p>
                      <p style="margin:0;font-family:Georgia,'Times New Roman',serif;font-size:40px;line-height:1;letter-spacing:0.28em;color:#fffaf2;font-weight:500;">
                        {{ .Token }}
                      </p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:24px 36px 36px;">
                <p style="margin:0 0 18px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:1.55;color:#6b635a;">
                  Prefer a link? <a href="{{ .ConfirmationURL }}" style="color:#7a3228;text-decoration:underline;">Confirm email address</a>
                </p>
                <p style="margin:0;font-family:Georgia,'Times New Roman',serif;font-size:14px;color:#1a1512;">Amoha Galleria</p>
                <p style="margin:8px 0 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;color:#8a8176;">
                  <a href="{{ .SiteURL }}" style="color:#7a3228;text-decoration:none;">www.amohagalleria.com</a>
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
